<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610"
     role="img"
     aria-label="Arshpreet Kaur GitHub Banner">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712">
        <animate attributeName="stop-color"
                 values="#030712;#111827;#030712"
                 dur="12s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#0F172A">
        <animate attributeName="stop-color"
                 values="#0F172A;#1E293B;#0F172A"
                 dur="12s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>

      <animateTransform
          attributeName="gradientTransform"
          type="rotate"
          values="0 .5 .5;360 .5 .5"
          dur="18s"
          repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->

  <rect
      width="1180"
      height="610"
      rx="30"
      fill="url(#bg)"/>

  <!-- Floating glow -->

  <circle
      cx="170"
      cy="120"
      r="180"
      fill="#22D3EE"
      opacity=".08">

      <animate attributeName="r"
               values="180;220;180"
               dur="8s"
               repeatCount="indefinite"/>

  </circle>

  <circle
      cx="980"
      cy="520"
      r="200"
      fill="#7C3AED"
      opacity=".08">

      <animate attributeName="r"
               values="200;240;200"
               dur="10s"
               repeatCount="indefinite"/>

  </circle>

  <!-- Left Glass Panel -->

  <rect
      x="45"
      y="45"
      width="360"
      height="520"
      rx="24"
      fill="#0F172A"
      opacity=".88"
      stroke="url(#accent)"
      stroke-opacity=".35"/>

  <!-- ASCII -->

  <g filter="url(#glow)">

    <text x="82" y="120"
          font-family="monospace"
          font-size="18"
          fill="url(#accent)">
   █████
    </text>

    <text x="82" y="145"
          font-family="monospace"
          font-size="18"
          fill="url(#accent)">
  ██   ██
    </text>

    <text x="82" y="170"
          font-family="monospace"
          font-size="18"
          fill="url(#accent)">
  ███████
    </text>

    <text x="82" y="195"
          font-family="monospace"
          font-size="18"
          fill="url(#accent)">
  ██   ██
    </text>

    <text x="82" y="220"
          font-family="monospace"
          font-size="18"
          fill="url(#accent)">
  ██   ██
    </text>

    <text x="82" y="245"
          font-family="monospace"
          font-size="18"
          fill="url(#accent)">
  ██   ██
    </text>

    <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -8;0 0"
        dur="5s"
        repeatCount="indefinite"/>

  </g>

  <text x="80"
        y="330"
        font-size="17"
        font-family="monospace"
        fill="#94A3B8">
&gt; SYSTEM ONLINE
  </text>

  <text x="80"
        y="360"
        font-size="17"
        font-family="monospace"
        fill="#94A3B8">
&gt; AI MODE ENABLED
  </text>

  <!-- Right Panel -->

  <rect
      x="445"
      y="45"
      width="690"
      height="520"
      rx="24"
      fill="#0F172A"
      opacity=".90"
      stroke="url(#accent)"
      stroke-opacity=".30"/>

  <!-- Heading -->

  <text
      x="490"
      y="105"
      font-size="26"
      fill="#F8FAFC"
      font-family="Segoe UI">

Hi 👋

  </text>

  <text
      x="490"
      y="155"
      font-size="42"
      font-weight="700"
      fill="#F8FAFC"
      font-family="Segoe UI">

I'm ARSHPREET KAUR

  </text>

  <text
      x="490"
      y="210"
      font-size="24"
      fill="url(#accent)"
      font-family="JetBrains Mono">

AI Engineer |

    <animate attributeName="opacity"
             values="1;0;1"
             dur="1.1s"
             repeatCount="indefinite"/>

  </text>

  <!-- Info -->

  <text x="490" y="270" fill="#CBD5E1" font-size="18">
📍 India
  </text>

  <text x="490" y="305" fill="#CBD5E1" font-size="18">
🎓 Computer Science
  </text>

  <text x="490" y="340" fill="#CBD5E1" font-size="18">
🚀 AI • ML • Full Stack
  </text>

  <text x="490" y="375" fill="#CBD5E1" font-size="18">
🌐 github.com/ARSHPREETKAUR1234
  </text>

  <!-- Skills -->

  <g font-family="Segoe UI"
     font-size="15">

      <rect x="490" y="430" width="90" height="34" rx="17" fill="#1E293B"/>
      <text x="512" y="452" fill="#22D3EE">Python</text>

      <rect x="595" y="430" width="95" height="34" rx="17" fill="#1E293B"/>
      <text x="617" y="452" fill="#22D3EE">React</text>

      <rect x="705" y="430" width="95" height="34" rx="17" fill="#1E293B"/>
      <text x="723" y="452" fill="#22D3EE">FastAPI</text>

      <rect x="815" y="430" width="95" height="34" rx="17" fill="#1E293B"/>
      <text x="835" y="452" fill="#22D3EE">Docker</text>

      <rect x="925" y="430" width="120" height="34" rx="17" fill="#1E293B"/>
      <text x="944" y="452" fill="#22D3EE">PostgreSQL</text>

  </g>

  <!-- Footer -->

  <text
      x="490"
      y="520"
      fill="#94A3B8"
      font-size="18">

GitHub • LinkedIn • Portfolio

  </text>

</svg>
