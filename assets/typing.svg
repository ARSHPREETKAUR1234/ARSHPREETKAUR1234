<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="70"
     viewBox="0 0 900 70">

    <defs>

        <linearGradient id="typingGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="0%">

            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="50%" stop-color="#22D3EE"/>
            <stop offset="100%" stop-color="#10B981"/>

            <animateTransform
                attributeName="gradientTransform"
                type="rotate"
                values="0 .5 .5;360 .5 .5"
                dur="15s"
                repeatCount="indefinite"/>

        </linearGradient>

    </defs>

    <rect width="900"
          height="70"
          rx="12"
          fill="transparent"/>

    <!-- Role 1 -->

    <text x="20"
          y="45"
          font-family="JetBrains Mono, monospace"
          font-size="28"
          font-weight="600"
          fill="url(#typingGradient)">

        AI Engineer

        <animate attributeName="opacity"
                 values="1;1;1;0;0;0;1"
                 dur="18s"
                 repeatCount="indefinite"/>

    </text>

    <!-- Role 2 -->

    <text x="20"
          y="45"
          font-family="JetBrains Mono, monospace"
          font-size="28"
          font-weight="600"
          fill="url(#typingGradient)"
          opacity="0">

        Machine Learning Enthusiast

        <animate attributeName="opacity"
                 values="0;0;1;1;1;0;0"
                 dur="18s"
                 repeatCount="indefinite"/>

    </text>

    <!-- Role 3 -->

    <text x="20"
          y="45"
          font-family="JetBrains Mono, monospace"
          font-size="28"
          font-weight="600"
          fill="url(#typingGradient)"
          opacity="0">

        Full Stack Developer

        <animate attributeName="opacity"
                 values="0;0;0;0;1;1;0"
                 dur="18s"
                 repeatCount="indefinite"/>

    </text>

    <!-- Blinking Cursor -->

    <rect x="470"
          y="18"
          width="10"
          height="32"
          rx="2"
          fill="#22D3EE">

        <animate attributeName="opacity"
                 values="1;0;1"
                 dur="0.8s"
                 repeatCount="indefinite"/>

    </rect>

</svg>
